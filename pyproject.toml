[project]
name = "mazerunner"
version = "1.0.0"
description = "A continuous-control maze benchmark for multimodal models: one drag path, swept-disk scoring, certified-fair renders"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bradley Kenstler" }]
keywords = ["benchmark", "multimodal", "evaluation", "vision", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.4",
    "scipy>=1.14",
    "openai>=1.60",
    "anthropic>=0.45",
    "google-genai>=1.0",
]

[project.urls]
Homepage = "https://github.com/bckenstler/mazerunner"
Study = "https://github.com/bckenstler/mazerunner/blob/main/STUDY.md"

[project.scripts]
mazerunner = "mazerunner.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mazerunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
# Docstring rules are deliberately narrow. D100/D101/D104 pin the presence of
# module, class, and package docstrings; the rest are formatting only.
# D102/D103 (method/function) are NOT enabled on purpose: deciding which
# functions deserve prose is the house style (see CONTRIBUTING), and a linter
# that demands one everywhere would force noise onto two-line helpers. The
# rule that actually matters — long functions must be documented — is enforced
# by scripts/check_docstrings.py, which ruff cannot express.
# D205/D209/D403 are excluded for the same reason: the style writes two-line
# summaries and opens with lowercase noun phrases ("provider -> task -> [v]."),
# both of which those rules would reformat into something less readable.
select = ["D100", "D101", "D104", "D200", "D210", "D212", "D419"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100"]
