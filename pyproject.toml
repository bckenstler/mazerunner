[project]
name = "mazerunner"
version = "0.1.0"
description = "A continuous-control maze benchmark for multimodal models: one drag path, swept-disk scoring, certified-fair renders"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bradley Kenstler" }]
keywords = ["benchmark", "multimodal", "evaluation", "vision", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.4",
    "scipy>=1.14",
    "openai>=1.60",
    "anthropic>=0.45",
    "google-genai>=1.0",
]

[project.urls]
Homepage = "https://github.com/bkenstler/mazerunner"
Study = "https://github.com/bkenstler/mazerunner/blob/main/STUDY.md"

[project.scripts]
mazerunner = "mazerunner.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mazerunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
