[project]
name = "mazerunner"
version = "0.1.0"
description = "MazeRunner smoke benchmark: multimodal maze-tracing with automatic ground truth"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.4",
    "scipy>=1.14",
    "openai>=1.60",
    "anthropic>=0.45",
    "google-genai>=1.0",
]

[project.scripts]
mazerunner = "mazerunner.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mazerunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
