[project]
name = "mazerunner"
version = "0.1.0"
description = "Benchmark for evaluating vision-based GUI agents on maze navigation"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "openenv-core",
    "fastmcp",
    "uvicorn",
    "openai",
    "google-genai",
]

[project.scripts]
mazerunner = "mazerunner.__main__:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mazerunner"]
