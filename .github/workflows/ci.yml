name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: uv sync --dev
      - name: tests (offline by construction)
        run: uv run pytest -q
      - name: release gate — no internal references
        run: uv run python scripts/sanitize_release.py
      - name: generation determinism
        run: uv run mazerunner validate --skip-tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --dev
      - name: lint
        run: uv run ruff check .
      - name: documentation gate
        run: uv run python scripts/check_docstrings.py
