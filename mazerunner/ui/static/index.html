<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MazeRunner Viewer</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --green: #4ecca3;
    --text: #eee;
    --text2: #aab;
    --border: #2a2a4a;
    --red: #e94560;
    --yellow: #f0c040;
    --blue: #5090d0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top Bar */
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  .toolbar label { font-size: 13px; color: var(--text2); }
  .toolbar select, .toolbar input, .toolbar button { font-size: 13px; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); outline: none; }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--accent); }
  .toolbar button { cursor: pointer; font-weight: 600; }
  .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar button.primary:hover { opacity: 0.9; }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }
  .toolbar .spacer { flex: 1; }

  /* Main Layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Left Pane - Conversation */
  .conv-pane { width: 50%; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .conv-header { padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .conv-scroll { flex: 1; overflow-y: auto; padding: 12px; }

  .turn-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
  .turn-card.active { border-color: var(--accent); }
  .turn-header { padding: 8px 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .turn-header:hover { background: rgba(255,255,255,0.03); }
  .turn-body { padding: 0 12px 10px; font-size: 13px; line-height: 1.5; display: none; }
  .turn-card.expanded .turn-body { display: block; }

  .turn-content { white-space: pre-wrap; color: var(--text2); margin-bottom: 8px; max-height: 200px; overflow-y: auto; }
  .tool-call { background: var(--bg); border-radius: 4px; padding: 8px; margin: 4px 0; font-family: monospace; font-size: 12px; }
  .tool-result { padding: 6px 8px; border-radius: 4px; margin: 4px 0; font-size: 12px; }
  .tool-result.accepted { background: rgba(78, 204, 163, 0.15); border-left: 3px solid var(--green); }
  .tool-result.rejected { background: rgba(233, 69, 96, 0.15); border-left: 3px solid var(--red); }
  .tool-result.finished { background: rgba(80, 144, 208, 0.15); border-left: 3px solid var(--blue); }

  .badge { font-size: 11px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
  .badge.accepted { background: rgba(78, 204, 163, 0.2); color: var(--green); }
  .badge.rejected { background: rgba(233, 69, 96, 0.2); color: var(--red); }
  .badge.finished { background: rgba(80, 144, 208, 0.2); color: var(--blue); }
  .badge.no-tool { background: rgba(240, 192, 64, 0.2); color: var(--yellow); }

  /* Right Pane - Maze Canvas */
  .maze-pane { width: 50%; display: flex; flex-direction: column; overflow: hidden; }
  .maze-header { padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .maze-canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 16px; position: relative; }
  .maze-canvas-wrap canvas { image-rendering: pixelated; }
  .stats-overlay { position: absolute; top: 16px; right: 16px; background: rgba(22, 33, 62, 0.9); padding: 10px 14px; border-radius: 6px; font-size: 12px; line-height: 1.8; border: 1px solid var(--border); }
  .stats-overlay .val { font-weight: 600; }
  .stats-overlay .val.good { color: var(--green); }
  .stats-overlay .val.bad { color: var(--red); }

  /* Playback Bar */
  .playback { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
  .playback button { font-size: 16px; padding: 4px 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer; }
  .playback button:hover { border-color: var(--accent); }
  .playback button:disabled { opacity: 0.3; cursor: default; }
  .playback input[type="range"] { flex: 1; accent-color: var(--accent); }
  .playback .turn-label { font-size: 13px; min-width: 80px; text-align: center; }

  /* Status bar */
  .status-bar { padding: 6px 16px; background: var(--surface); border-top: 1px solid var(--border); font-size: 12px; color: var(--text2); flex-shrink: 0; }

  /* Empty state */
  .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text2); font-size: 14px; text-align: center; padding: 20px; }

  /* Checkbox toggle */
  .toggle { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text2); cursor: pointer; }
  .toggle input { accent-color: var(--accent); }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <label>Mode:</label>
  <select id="mode-select">
    <option value="replay">Replay</option>
    <option value="results">Results</option>
    <option value="live">Live</option>
  </select>

  <!-- Replay controls -->
  <span id="replay-controls" style="display:flex;gap:8px;align-items:center;">
    <label>Run:</label>
    <select id="run-select" style="max-width:300px;"></select>
  </span>

  <!-- Results controls -->
  <span id="results-controls" style="display:none;gap:8px;align-items:center;">
    <label>File:</label>
    <select id="results-file-select" style="max-width:200px;"></select>
    <label>Maze:</label>
    <select id="results-maze-select" style="max-width:150px;"></select>
  </span>

  <!-- Live controls -->
  <span id="live-controls" style="display:none;gap:8px;align-items:center;">
    <label>Model:</label>
    <select id="model-input" style="width:220px;">
      <optgroup label="Anthropic">
        <option value="claude-opus-4-6">Claude Opus 4.6</option>
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
      </optgroup>
      <optgroup label="OpenAI">
        <option value="gpt-5.2">GPT-5.2</option>
      </optgroup>
      <optgroup label="Google">
        <option value="gemini/gemini-3.1-pro-preview">Gemini 3.1 Pro</option>
        <option value="gemini/gemini-3-flash-preview">Gemini 3 Flash</option>
      </optgroup>
    </select>
    <label>Maze:</label>
    <select id="maze-select" style="max-width:150px;"></select>
    <label>Turns:</label>
    <input id="max-turns-input" type="number" value="30" style="width:60px;">
  </span>

  <div class="spacer"></div>
  <button id="go-btn" class="primary">Load</button>
</div>

<!-- Main -->
<div class="main">
  <!-- Left: Conversation -->
  <div class="conv-pane">
    <div class="conv-header">
      <span id="conv-title">Conversation</span>
    </div>
    <div class="conv-scroll" id="conv-scroll">
      <div class="empty-state" id="conv-empty">Select a run or maze to begin</div>
    </div>
  </div>

  <!-- Right: Maze Canvas -->
  <div class="maze-pane">
    <div class="maze-header">
      <span>Maze View</span>
      <div class="spacer" style="flex:1;"></div>
      <label class="toggle"><input type="checkbox" id="show-gt"> Show GT Solution</label>
    </div>
    <div class="maze-canvas-wrap">
      <canvas id="maze-canvas"></canvas>
      <div class="stats-overlay" id="stats-overlay" style="display:none;"></div>
    </div>
  </div>
</div>

<!-- Playback Bar -->
<div class="playback">
  <button id="pb-first" title="First turn">&#x23EE;</button>
  <button id="pb-prev" title="Previous turn">&#x25C0;</button>
  <button id="pb-play" title="Play/Pause">&#x23EF;</button>
  <button id="pb-next" title="Next turn">&#x25B6;</button>
  <button id="pb-last" title="Last turn">&#x23ED;</button>
  <span class="turn-label" id="turn-label">-- / --</span>
  <input type="range" id="turn-slider" min="0" max="0" value="0">
</div>

<!-- Status Bar -->
<div class="status-bar" id="status-bar">Ready</div>

<script>
// ============================================================
// State
// ============================================================
const state = {
  mode: 'replay',
  turns: [],          // array of turn data
  currentTurn: -1,    // playback position (0-indexed into turns, -1 = none)
  mazeImage: null,    // HTMLImageElement
  gtPolyline: null,   // [[x,y], ...]
  playing: false,
  playInterval: null,
  ws: null,           // WebSocket for live mode
  imageSize: null,    // {w, h}
};

// ============================================================
// DOM refs
// ============================================================
const $ = id => document.getElementById(id);
const modeSelect = $('mode-select');
const replayControls = $('replay-controls');
const resultsControls = $('results-controls');
const liveControls = $('live-controls');
const runSelect = $('run-select');
const resultsFileSelect = $('results-file-select');
const resultsMazeSelect = $('results-maze-select');
const modelInput = $('model-input');
const mazeSelect = $('maze-select');
const maxTurnsInput = $('max-turns-input');
const goBtn = $('go-btn');
const convScroll = $('conv-scroll');
const convEmpty = $('conv-empty');
const convTitle = $('conv-title');
const canvas = $('maze-canvas');
const ctx = canvas.getContext('2d');
const statsOverlay = $('stats-overlay');
const showGtCheck = $('show-gt');
const turnSlider = $('turn-slider');
const turnLabel = $('turn-label');
const statusBar = $('status-bar');
const pbFirst = $('pb-first');
const pbPrev = $('pb-prev');
const pbPlay = $('pb-play');
const pbNext = $('pb-next');
const pbLast = $('pb-last');

// ============================================================
// Init
// ============================================================
async function init() {
  modeSelect.addEventListener('change', onModeChange);
  goBtn.addEventListener('click', onGo);
  showGtCheck.addEventListener('change', () => drawMaze());
  turnSlider.addEventListener('input', () => goToTurn(parseInt(turnSlider.value)));
  pbFirst.addEventListener('click', () => goToTurn(0));
  pbPrev.addEventListener('click', () => goToTurn(Math.max(0, state.currentTurn - 1)));
  pbNext.addEventListener('click', () => goToTurn(Math.min(state.turns.length - 1, state.currentTurn + 1)));
  pbLast.addEventListener('click', () => goToTurn(state.turns.length - 1));
  pbPlay.addEventListener('click', togglePlay);

  // Load initial data
  await Promise.all([loadRuns(), loadResults(), loadMazes()]);
  onModeChange();
}

function onModeChange() {
  state.mode = modeSelect.value;
  replayControls.style.display = state.mode === 'replay' ? 'flex' : 'none';
  resultsControls.style.display = state.mode === 'results' ? 'flex' : 'none';
  liveControls.style.display = state.mode === 'live' ? 'flex' : 'none';
  goBtn.textContent = state.mode === 'live' ? 'Run' : 'Load';
}

// ============================================================
// Data loading
// ============================================================
async function loadRuns() {
  try {
    const res = await fetch('/api/runs');
    const data = await res.json();
    runSelect.innerHTML = '';
    if (!data.runs || data.runs.length === 0) {
      runSelect.innerHTML = '<option value="">No runs found</option>';
      return;
    }
    for (const run of data.runs) {
      const opt = document.createElement('option');
      opt.value = run.run_id;
      opt.setAttribute('data-path', run.path);
      opt.textContent = `${run.model} / ${run.maze_id} (${run.num_turns} turns)`;
      runSelect.appendChild(opt);
    }
  } catch (e) {
    runSelect.innerHTML = '<option value="">Error loading runs</option>';
  }
}

async function loadResults() {
  try {
    const res = await fetch('/api/results');
    const data = await res.json();
    resultsFileSelect.innerHTML = '';
    if (!data.results || data.results.length === 0) {
      resultsFileSelect.innerHTML = '<option value="">No results found</option>';
      return;
    }
    for (const r of data.results) {
      const opt = document.createElement('option');
      opt.value = r.filename;
      opt.textContent = `${r.filename} (${r.num_entries} mazes)`;
      resultsFileSelect.appendChild(opt);
    }
    resultsFileSelect.addEventListener('change', onResultsFileChange);
    onResultsFileChange();
  } catch (e) {
    resultsFileSelect.innerHTML = '<option value="">Error loading results</option>';
  }
}

async function onResultsFileChange() {
  const filename = resultsFileSelect.value;
  if (!filename) return;
  try {
    const res = await fetch(`/api/results/${filename}/mazes`);
    const data = await res.json();
    resultsMazeSelect.innerHTML = '';
    for (const id of (data.maze_ids || [])) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = id;
      resultsMazeSelect.appendChild(opt);
    }
  } catch (e) {
    resultsMazeSelect.innerHTML = '<option value="">Error</option>';
  }
}

async function loadMazes() {
  try {
    const res = await fetch('/api/mazes');
    const data = await res.json();
    mazeSelect.innerHTML = '';
    for (const m of (data.mazes || [])) {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = `${m.id} (${m.grid}, T${m.tier})`;
      mazeSelect.appendChild(opt);
    }
  } catch (e) {
    mazeSelect.innerHTML = '<option value="">Error loading mazes</option>';
  }
}

// ============================================================
// Go button handler
// ============================================================
async function onGo() {
  stopPlay();

  if (state.mode === 'replay') {
    await loadReplayRun();
  } else if (state.mode === 'results') {
    await loadResultEntry();
  } else if (state.mode === 'live') {
    await startLiveRun();
  }
}

async function loadReplayRun() {
  const runId = runSelect.value;
  if (!runId) return;

  setStatus('Loading run...');
  goBtn.disabled = true;
  try {
    const res = await fetch(`/api/runs/${runId}`);
    const data = await res.json();
    if (data.error) { setStatus('Error: ' + data.error); return; }

    state.turns = data.turns || [];
    state.currentTurn = -1;

    // Load maze image
    const mazeId = data.maze_id;
    await loadMazeImage(mazeId);
    await loadGtData(mazeId);

    convTitle.textContent = `${data.model} / Maze ${data.maze_id}`;
    renderConversation();
    updatePlayback();

    if (state.turns.length > 0) goToTurn(0);
    setStatus(`Loaded: ${state.turns.length} turns`);
  } catch (e) {
    setStatus('Error loading run: ' + e.message);
  } finally {
    goBtn.disabled = false;
  }
}

async function loadResultEntry() {
  const filename = resultsFileSelect.value;
  const mazeId = resultsMazeSelect.value;
  if (!filename || !mazeId) return;

  setStatus('Loading result...');
  goBtn.disabled = true;
  try {
    const res = await fetch(`/api/results/${filename}/${mazeId}`);
    const data = await res.json();
    if (data.error) { setStatus('Error: ' + data.error); return; }

    // Single-shot results: create a synthetic turn from the prediction
    const prediction = data.prediction;
    let points = [];
    if (prediction) {
      if (prediction.encoding === 'polyline' && prediction.data && prediction.data.points) {
        points = prediction.data.points;
      }
    }

    // Create a single synthetic turn to display the path
    state.turns = [{
      turn: 1,
      role: 'assistant',
      content: `Single-shot prediction (${data.mode || 'single-shot'})`,
      tool_calls: [{
        id: 'single-shot',
        name: 'submit_segment',
        arguments: { points: points },
      }],
      tool_results: [{
        tool_call_id: 'single-shot',
        status: 'ACCEPTED',
        reason: `Full path: ${points.length} points`,
        segment_points: points,
        path_so_far: points,
        num_points: points.length,
        path_length: 0,
      }],
    }];
    state.currentTurn = -1;

    await loadMazeImage(mazeId);
    await loadGtData(mazeId);

    const modelName = filename.replace('.jsonl', '');
    convTitle.textContent = `${modelName} / Maze ${mazeId} (single-shot)`;
    renderConversation();
    updatePlayback();
    if (state.turns.length > 0) goToTurn(0);
    setStatus(`Loaded single-shot result for maze ${mazeId}`);
  } catch (e) {
    setStatus('Error: ' + e.message);
  } finally {
    goBtn.disabled = false;
  }
}

async function startLiveRun() {
  const model = modelInput.value;
  const mazeId = mazeSelect.value;
  if (!model || !mazeId) { setStatus('Enter model and select maze'); return; }

  const maxTurns = parseInt(maxTurnsInput.value) || 30;

  // Reset state
  state.turns = [];
  state.currentTurn = -1;

  await loadMazeImage(mazeId);
  await loadGtData(mazeId);
  convTitle.textContent = `${model} / Maze ${mazeId} (live)`;
  clearConversation();
  updatePlayback();
  drawMaze();

  setStatus('Connecting...');
  goBtn.disabled = true;

  const wsUrl = `ws://${location.host}/ws/run`;
  const ws = new WebSocket(wsUrl);
  state.ws = ws;

  ws.onopen = () => {
    ws.send(JSON.stringify({ model, maze_id: mazeId, max_turns: maxTurns }));
    setStatus('Running...');
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'turn') {
      state.turns.push(msg.data);
      appendTurnCard(msg.data, state.turns.length - 1);
      goToTurn(state.turns.length - 1);
      updatePlayback();
      setStatus(`Turn ${state.turns.length}...`);
    } else if (msg.type === 'completed') {
      setStatus(`Completed: ${state.turns.length} turns`);
      goBtn.disabled = false;
      updateStatsOverlay(msg.final_result);
    } else if (msg.type === 'error') {
      setStatus('Error: ' + msg.message);
      goBtn.disabled = false;
    } else if (msg.type === 'started') {
      setStatus(`Running ${msg.model} on maze ${msg.maze_id}...`);
    }
  };

  ws.onerror = () => {
    setStatus('WebSocket error');
    goBtn.disabled = false;
  };

  ws.onclose = () => {
    if (goBtn.disabled) {
      setStatus('Connection closed');
      goBtn.disabled = false;
    }
  };
}

// ============================================================
// Maze image & GT loading
// ============================================================
async function loadMazeImage(mazeId) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      state.mazeImage = img;
      state.imageSize = { w: img.naturalWidth, h: img.naturalHeight };
      resolve();
    };
    img.onerror = () => resolve();
    img.src = `/api/mazes/${mazeId}/image?t=${Date.now()}`;
  });
}

async function loadGtData(mazeId) {
  try {
    const res = await fetch(`/api/mazes/${mazeId}/gt`);
    const data = await res.json();
    state.gtPolyline = data.solution_polyline || null;
  } catch (e) {
    state.gtPolyline = null;
  }
}

// ============================================================
// Conversation rendering
// ============================================================
function clearConversation() {
  convScroll.innerHTML = '';
  convEmpty.style.display = 'none';
}

function renderConversation() {
  convScroll.innerHTML = '';
  if (state.turns.length === 0) {
    convScroll.innerHTML = '<div class="empty-state">No turns to display</div>';
    return;
  }
  state.turns.forEach((t, i) => appendTurnCard(t, i));
}

function appendTurnCard(turn, index) {
  convEmpty.style.display = 'none';
  const card = document.createElement('div');
  card.className = 'turn-card' + (index === state.currentTurn ? ' active' : '');
  card.id = `turn-card-${index}`;

  // Determine badge
  let badgeClass = 'no-tool';
  let badgeText = 'no tool';
  if (turn.tool_results && turn.tool_results.length > 0) {
    const lastResult = turn.tool_results[turn.tool_results.length - 1];
    const status = lastResult.status || '';
    if (status === 'ACCEPTED') { badgeClass = 'accepted'; badgeText = 'ACCEPTED'; }
    else if (status === 'FINISHED') { badgeClass = 'finished'; badgeText = 'FINISHED'; }
    else if (status.startsWith('REJECTED')) { badgeClass = 'rejected'; badgeText = status; }
    else { badgeText = status; }
  }

  card.innerHTML = `
    <div class="turn-header" onclick="toggleTurnCard(${index})">
      <span>Turn ${turn.turn || index + 1}</span>
      <span class="badge ${badgeClass}">${badgeText}</span>
    </div>
    <div class="turn-body">
      ${turn.content ? `<div class="turn-content">${escHtml(turn.content)}</div>` : ''}
      ${(turn.tool_calls || []).map(tc => `
        <div class="tool-call">
          <strong>${tc.name}</strong>(${tc.name === 'submit_segment' ? (tc.arguments.points || []).length + ' pts' : ''})
        </div>
      `).join('')}
      ${(turn.tool_results || []).map(tr => {
        const cls = tr.status === 'ACCEPTED' ? 'accepted' : tr.status === 'FINISHED' ? 'finished' : 'rejected';
        return `<div class="tool-result ${cls}">
          <strong>${tr.status}</strong>: ${escHtml(tr.reason || '')}
          ${tr.violation_point ? `<br>Violation at: (${tr.violation_point[0]?.toFixed(1)}, ${tr.violation_point[1]?.toFixed(1)})` : ''}
          ${tr.num_points != null ? `<br>Path: ${tr.num_points} pts, ${(tr.path_length || 0).toFixed(0)}px` : ''}
        </div>`;
      }).join('')}
    </div>
  `;

  card.addEventListener('click', (e) => {
    if (!e.target.closest('.turn-header')) goToTurn(index);
  });

  convScroll.appendChild(card);
  convScroll.scrollTop = convScroll.scrollHeight;
}

function toggleTurnCard(index) {
  const card = document.getElementById(`turn-card-${index}`);
  if (card) card.classList.toggle('expanded');
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ============================================================
// Playback
// ============================================================
function goToTurn(index) {
  if (state.turns.length === 0) return;
  index = Math.max(0, Math.min(state.turns.length - 1, index));
  state.currentTurn = index;

  // Update active card
  document.querySelectorAll('.turn-card').forEach((c, i) => {
    c.classList.toggle('active', i === index);
  });

  // Expand active card
  const activeCard = document.getElementById(`turn-card-${index}`);
  if (activeCard) {
    activeCard.classList.add('expanded');
    activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  turnSlider.value = index;
  turnLabel.textContent = `${index + 1} / ${state.turns.length}`;

  drawMaze();
  updateStatsFromTurns();
}

function updatePlayback() {
  const n = state.turns.length;
  turnSlider.max = Math.max(0, n - 1);
  turnLabel.textContent = n > 0 ? `${state.currentTurn + 1} / ${n}` : '-- / --';
  pbFirst.disabled = n === 0;
  pbPrev.disabled = n === 0;
  pbNext.disabled = n === 0;
  pbLast.disabled = n === 0;
  pbPlay.disabled = n === 0;
}

function togglePlay() {
  if (state.playing) {
    stopPlay();
  } else {
    state.playing = true;
    pbPlay.textContent = '\u23F8';
    if (state.currentTurn >= state.turns.length - 1) goToTurn(0);
    state.playInterval = setInterval(() => {
      if (state.currentTurn >= state.turns.length - 1) {
        stopPlay();
        return;
      }
      goToTurn(state.currentTurn + 1);
    }, 1200);
  }
}

function stopPlay() {
  state.playing = false;
  pbPlay.textContent = '\u23EF';
  if (state.playInterval) { clearInterval(state.playInterval); state.playInterval = null; }
}

// ============================================================
// Canvas Drawing
// ============================================================
function drawMaze() {
  if (!state.mazeImage) {
    canvas.width = 400;
    canvas.height = 300;
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, 400, 300);
    ctx.fillStyle = '#666';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No maze loaded', 200, 150);
    return;
  }

  const w = state.mazeImage.naturalWidth;
  const h = state.mazeImage.naturalHeight;

  // Fit canvas within the pane while keeping 2x resolution for sharpness
  const wrap = canvas.parentElement;
  const maxW = wrap.clientWidth - 32;
  const maxH = wrap.clientHeight - 32;
  const displayScale = Math.min(1, maxW / w, maxH / h);
  const displayW = Math.round(w * displayScale);
  const displayH = Math.round(h * displayScale);
  const scale = 2;

  canvas.width = displayW * scale;
  canvas.height = displayH * scale;
  canvas.style.width = displayW + 'px';
  canvas.style.height = displayH + 'px';
  ctx.imageSmoothingEnabled = true;

  // All drawing coords need to account for display scaling
  const drawScale = displayScale * scale;

  // Draw base maze image
  ctx.drawImage(state.mazeImage, 0, 0, displayW * scale, displayH * scale);

  // Draw GT solution if checked
  if (showGtCheck.checked && state.gtPolyline && state.gtPolyline.length > 1) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#5090d0';
    ctx.lineWidth = 3 * scale;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(state.gtPolyline[0][0] * drawScale, state.gtPolyline[0][1] * drawScale);
    for (let i = 1; i < state.gtPolyline.length; i++) {
      ctx.lineTo(state.gtPolyline[i][0] * drawScale, state.gtPolyline[i][1] * drawScale);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Draw path segments up to current turn
  if (state.currentTurn < 0) return;

  for (let t = 0; t <= state.currentTurn && t < state.turns.length; t++) {
    const turn = state.turns[t];
    const isCurrent = t === state.currentTurn;

    for (const tr of (turn.tool_results || [])) {
      if (tr.status === 'FINISHED') continue;

      const points = tr.segment_points || [];
      if (points.length < 2) continue;

      const accepted = tr.status === 'ACCEPTED';

      ctx.save();
      ctx.strokeStyle = accepted ? '#4ecca3' : '#e94560';
      ctx.lineWidth = (isCurrent ? 3 : 2) * scale;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.globalAlpha = isCurrent ? 1.0 : 0.7;

      if (!accepted) {
        ctx.setLineDash([4 * scale, 4 * scale]);
      }

      ctx.beginPath();
      ctx.moveTo(points[0][0] * drawScale, points[0][1] * drawScale);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i][0] * drawScale, points[i][1] * drawScale);
      }
      ctx.stroke();
      ctx.restore();

      // Draw violation point
      if (tr.violation_point) {
        ctx.save();
        ctx.fillStyle = '#e94560';
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(
          tr.violation_point[0] * drawScale,
          tr.violation_point[1] * drawScale,
          4 * scale, 0, Math.PI * 2
        );
        ctx.fill();
        ctx.restore();
      }
    }
  }
}

function updateStatsFromTurns() {
  if (state.currentTurn < 0 || state.turns.length === 0) {
    statsOverlay.style.display = 'none';
    return;
  }

  let accepted = 0, rejected = 0, wallRej = 0, totalPts = 0, pathLen = 0;

  for (let t = 0; t <= state.currentTurn; t++) {
    const turn = state.turns[t];
    for (const tr of (turn.tool_results || [])) {
      if (tr.status === 'ACCEPTED') {
        accepted++;
        totalPts = tr.num_points || totalPts;
        pathLen = tr.path_length || pathLen;
      } else if (tr.status && tr.status.startsWith('REJECTED')) {
        rejected++;
        if (tr.status === 'REJECTED_WALL') wallRej++;
      }
    }
  }

  statsOverlay.style.display = 'block';
  statsOverlay.innerHTML = `
    <div>Accepted: <span class="val good">${accepted}</span></div>
    <div>Rejected: <span class="val bad">${rejected}</span>${wallRej ? ` (${wallRej} wall)` : ''}</div>
    <div>Points: <span class="val">${totalPts}</span></div>
    <div>Length: <span class="val">${pathLen.toFixed(0)}px</span></div>
  `;
}

function updateStatsOverlay(finalResult) {
  if (!finalResult) return;
  const stats = finalResult.stats || {};
  const evalResult = finalResult.eval_result || {};
  const success = evalResult.success ? evalResult.success['0'] : null;

  statsOverlay.style.display = 'block';
  statsOverlay.innerHTML = `
    <div>Result: <span class="val ${success ? 'good' : 'bad'}">${success ? 'SUCCESS' : success === false ? 'FAIL' : '?'}</span></div>
    <div>Accepted: <span class="val good">${stats.segments_accepted || 0}</span></div>
    <div>Rejected: <span class="val bad">${stats.segments_rejected || 0}</span></div>
    <div>Finish: <span class="val">${finalResult.finish_reason || '?'}</span></div>
    ${evalResult.goal_distance != null ? `<div>Goal dist: <span class="val">${evalResult.goal_distance.toFixed(1)}px</span></div>` : ''}
  `;
}

// ============================================================
// Utility
// ============================================================
function setStatus(msg) { statusBar.textContent = msg; }

// ============================================================
// Start
// ============================================================
init();
</script>
